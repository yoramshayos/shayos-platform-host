name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android platform tools
        shell: bash
        run: sdkmanager "platform-tools"

      - name: Locate source archive
        id: archive
        shell: bash
        run: |
          ARCHIVE=$(find . -name "shayos-platform-host-source-*.tar*.gz" -type f | head -1)

          if [ -z "$ARCHIVE" ]; then
            echo "Source archive not found"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "Archive: $ARCHIVE"
          echo "path=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Extract source
        shell: bash
        run: |
          rm -rf build
          mkdir -p build
          tar -xzf "${{ steps.archive.outputs.path }}" -C build
          find build -maxdepth 3 -type f | sort | head -200

      - name: Locate project
        id: project
        shell: bash
        run: |
          PACKAGE_JSON=$(find build -name package.json -type f | head -1)

          if [ -z "$PACKAGE_JSON" ]; then
            echo "package.json not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE_JSON")

          echo "Project directory: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        working-directory: ${{ steps.project.outputs.dir }}
        run: npm install --no-audit --no-fund

      - name: Install TypeScript
        working-directory: ${{ steps.project.outputs.dir }}
        run: npm install --no-save typescript

      - name: Verify source
        working-directory: ${{ steps.project.outputs.dir }}
        run: npm run verify

      - name: Prepare Android project
        working-directory: ${{ steps.project.outputs.dir }}
        run: npm run android:prepare

      - name: Make Gradle executable
        working-directory: ${{ steps.project.outputs.dir }}/android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}/android
        run: ./gradlew assembleDebug

      - name: Prepare APK artifact
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK not found"
            find android/app/build/outputs -type f | sort || true
            exit 1
          fi

          mkdir -p release
          cp "$APK" release/ShayOS-FOCUS-0.5.0-debug.apk
          ls -lh release/ShayOS-FOCUS-0.5.0-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shayos-focus-android-apk
          path: ${{ steps.project.outputs.dir }}/release/ShayOS-FOCUS-0.5.0-debug.apk
          if-no-files-found: error
          retention-days: 14
